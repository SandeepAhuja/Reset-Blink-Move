name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build and run unit tests
        run: |
          xcodebuild test \
            -project Reset.xcodeproj \
            -scheme Reset \
            -destination 'platform=macOS' \
            -only-testing:ResetTests \
            CODE_SIGNING_ALLOWED=NO
